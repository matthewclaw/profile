name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (Tailwind CSS, blog drafts, JSON-LD, noscript fallback, resume.md, robots.txt, sitemap.xml)
        run: npm run build

      - name: Remove files that shouldn't be published
        # Keep only what the live site actually serves. Everything below is
        # either build tooling, source that got rendered to HTML, or repo meta.
        # generated/resume.md is kept — it's linked from index.html.
        run: |
          rm -rf node_modules .git .github util scratchpad/drafts
          rm -f assets/css/tailwind-source.css
          rm -f generated/noscript.html generated/schema.jsonld
          rm -f package.json package-lock.json README.md profile_preview.gif .gitignore

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
