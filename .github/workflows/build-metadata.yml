name: Build metadata

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: build-metadata-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate site metadata (JSON-LD, noscript fallback, resume.md, robots.txt, sitemap.xml)
        run: npm run build

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add generated robots.txt sitemap.xml index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: regenerate site metadata [skip ci]"
            git push
          fi
